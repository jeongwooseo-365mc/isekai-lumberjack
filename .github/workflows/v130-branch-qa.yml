name: v1.3.0 branch browser QA

on:
  push:
    branches:
      - work/v130-followup

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node tools/test_game.js
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/test_browser_v122.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v130-branch-web-qa
          path: release/web-qa/
          if-no-files-found: warn
