name: v132 stage 2 QA
on:
  push:
    branches: [work/v132-stage2]
    paths-ignore: ["**/*.md"]
jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install Pillow
      - run: node tools/prepare_dist.js
      - run: python3 tools/validate_project.py
      - run: node tools/test_game.js
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/test_browser_v122.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v132-stage2-web-qa
          path: release/web-qa/
          retention-days: 30
