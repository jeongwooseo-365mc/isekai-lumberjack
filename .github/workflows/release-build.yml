name: Build Android and Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Select installed Android NDK
        shell: bash
        run: echo "NDK_HOME=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm install
      - name: Verify game logic
        run: node tools/test_game.js
      - name: Prepare web assets
        run: npm run prepare:web
      - name: Initialize Android project
        run: npx tauri android init --ci
      - name: Generate padded Android launcher icons
        run: ./node_modules/.bin/tauri icon src-tauri/icons/icon-mobile.png
      - name: Apply immersive mobile shell and short app label
        run: python3 tools/patch_android.py
      - name: Verify Android identity, shell, and launcher icons
        run: |
          python3 tools/patch_android.py --check
          python3 tools/verify_android_package.py --generated
      - name: Build ARM64 release and x86_64 runtime-test APKs
        run: npx tauri android build --ci --apk --split-per-abi --target aarch64 --target x86_64
      - name: Sign and verify QA APKs
        shell: bash
        run: |
          set -euo pipefail
          arm_apk=""
          x86_apk=""
          apk_index=0
          while IFS= read -r apk; do
            entries="$RUNNER_TEMP/apk-entries-$apk_index.txt"
            unzip -Z1 "$apk" > "$entries"
            if grep -q '^lib/arm64-v8a/' "$entries"; then arm_apk="$apk"; fi
            if grep -q '^lib/x86_64/' "$entries"; then x86_apk="$apk"; fi
            apk_index=$((apk_index + 1))
          done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-unsigned.apk' -print)
          test -n "$arm_apk"
          test -n "$x86_apk"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/isekai-lumberjack-test.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Isekai Lumberjack Test,O=Isekai Lumberjack,C=KR"

          mkdir -p release
          sign_apk() {
            local input="$1"
            local aligned="$2"
            local output="$3"
            "$build_tools/zipalign" -f -p 4 "$input" "$aligned"
            "$build_tools/apksigner" sign \
              --ks "$RUNNER_TEMP/isekai-lumberjack-test.keystore" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$output" \
              "$aligned"
            "$build_tools/apksigner" verify --verbose --print-certs "$output"
          }

          sign_apk "$arm_apk" "$RUNNER_TEMP/isekai-lumberjack-arm64-aligned.apk" "release/isekai-lumberjack-v1.1.2-android-arm64.apk"
          sign_apk "$x86_apk" "$RUNNER_TEMP/isekai-lumberjack-x86_64-aligned.apk" "$RUNNER_TEMP/isekai-lumberjack-v1.1.2-android-x86_64.apk"
          echo "X86_APK=$RUNNER_TEMP/isekai-lumberjack-v1.1.2-android-x86_64.apk" >> "$GITHUB_ENV"

          python3 tools/verify_android_package.py --apk "release/isekai-lumberjack-v1.1.2-android-arm64.apk" --abi arm64-v8a
          python3 tools/verify_android_package.py --apk "$RUNNER_TEMP/isekai-lumberjack-v1.1.2-android-x86_64.apk" --abi x86_64
      - name: Enable KVM for launch smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and play through startup on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/android_smoke_test.sh "$X86_APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: isekai-lumberjack-v1.1.2-android-arm64-apk
          path: |
            release/isekai-lumberjack-v1.1.2-android-arm64.apk
            release/android-launch.png
            release/android-intro.png
            release/android-opening-1.png
            release/android-opening-2.png
            release/android-opening-3.png
            release/android-main.png
            release/android-launch-check.txt
            release/android-install.txt
            release/android-window.xml
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm install
      - name: Verify game logic
        run: node tools/test_game.js
      - name: Prepare web assets
        run: npm run prepare:web
      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v1
        with:
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: isekai-lumberjack-v1.1.2-windows-[bundle]
