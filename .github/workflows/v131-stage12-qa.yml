name: v1.3.1 stage 1-2 QA

on:
  push:
    branches:
      - work/v131-stage12

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: python3 -m pip install Pillow
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node tools/prepare_dist.js
      - run: python3 tools/validate_project.py
      - run: node tools/test_game.js
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/test_browser_v122.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v131-stage12-web-qa
          path: release/web-qa/
          if-no-files-found: warn
